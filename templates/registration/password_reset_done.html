<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Link Enviado - Redefinir Senha</title>
    <style>
        body.dark {
            background: #121212;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        .container {
            background: #1e1e1e;
            padding: 2rem 3rem;
            border-radius: 8px;
            box-shadow: 0 0 10px #00000099;
            max-width: 400px;
            text-align: center;
        }
        a {
            color: #6ec1e4;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 1.5rem;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="dark">
    <div class="container">
        <h2>Link de redefinição enviado!</h2>
        <p>Verifique seu e-mail para acessar o link de redefinição de senha.</p>
        <a href="{% url 'login' %}">
            <i data-feather="arrow-left"></i> Voltar ao Login
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script>feather.replace()</script>
</body>
</html>
