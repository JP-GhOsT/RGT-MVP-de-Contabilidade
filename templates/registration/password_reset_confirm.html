<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redefinir Senha</title>
    <style>
        body.dark {
            background: #121212;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        .container {
            background: #1e1e1e;
            padding: 2rem 3rem;
            border-radius: 8px;
            box-shadow: 0 0 10px #00000099;
            max-width: 400px;
            width: 100%;
        }
        h2 {
            margin-bottom: 1rem;
            text-align: center;
        }
        label {
            display: block;
            margin-top: 1rem;
            margin-bottom: 0.3rem;
        }
        input[type="password"] {
            width: 100%;
            padding: 0.5rem;
            border-radius: 4px;
            border: none;
            outline: none;
            background: #2c2c2c;
            color: #eee;
            font-size: 1rem;
        }
        input[type="password"]:focus {
            box-shadow: 0 0 5px #6ec1e4;
        }
        .btn-submit {
            margin-top: 1.8rem;
            width: 100%;
            padding: 0.8rem;
            background: #6ec1e4;
            border: none;
            border-radius: 6px;
            color: #121212;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .btn-submit:hover {
            background: #52a1cb;
        }
        .errors {
            color: #f44336;
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }
        .trocar-link {
            margin-top: 1.5rem;
            text-align: center;
        }
        .trocar-link a {
            color: #6ec1e4;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .trocar-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="dark">
    <div class="container">
        <h2>Redefinir Senha</h2>
        <form method="POST" novalidate>
            {% csrf_token %}
            <label for="id_new_password1">Nova senha</label>
            {{ form.new_password1 }}
            {% if form.new_password1.errors %}
                <p class="errors">{{ form.new_password1.errors.0 }}</p>
            {% endif %}

            <label for="id_new_password2">Confirme a nova senha</label>
            {{ form.new_password2 }}
            {% if form.new_password2.errors %}
                <p class="errors">{{ form.new_password2.errors.0 }}</p>
            {% endif %}

            <button type="submit" class="btn-submit">Redefinir senha</button>
        </form>
        <div class="trocar-link">
            <a href="{% url 'login' %}">
                <i data-feather="arrow-left"></i> Voltar ao Login
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script>feather.replace()</script>
</body>
</html>
